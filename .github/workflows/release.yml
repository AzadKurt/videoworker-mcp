name: Check and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/check_examples.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Check tag matches package version
        run: python scripts/check_release_tag.py "$GITHUB_REF_NAME"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check installed wheel outside checkout
        run: |
          python -m venv /tmp/videoworker-wheel
          /tmp/videoworker-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/videoworker-wheel/bin/python -m videoworker_mcp --version
          /tmp/videoworker-wheel/bin/python "$GITHUB_WORKSPACE/scripts/check_stdio.py"
      - name: Publish artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.whl *.tar.gz SHA256SUMS --verify-tag --title "videoworker MCP $GITHUB_REF_NAME" --notes-file ../RELEASE.md
